<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" role="img" aria-label="Saransh Gupta - AI Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#050b16"/><stop offset="1" stop-color="#0a1830"/></linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00f0ff"/><stop offset="1" stop-color="#7c5cff"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#00f0ff" stroke-opacity="0.08"/></pattern>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#00f0ff" stop-opacity="0"/><stop offset="1" stop-color="#00f0ff" stop-opacity="0.25"/></linearGradient>
    <clipPath id="c"><rect width="1000" height="260" rx="14"/></clipPath>
  </defs>
  <g clip-path="url(#c)">
    <rect width="1000" height="260" fill="url(#bg)"/>
    <rect width="1000" height="260" fill="url(#grid)"/>
    <rect width="1000" height="40" fill="url(#scan)"><animateTransform attributeName="transform" type="translate" values="0,-40;0,260" dur="4s" repeatCount="indefinite"/></rect>
    <g fill="none" stroke="url(#glow)" stroke-width="2">
      <path d="M20 60V20H60"/><path d="M940 20H980V60"/><path d="M20 200V240H60"/><path d="M940 240H980V200"/>
    </g>
    <g transform="translate(790,130)" fill="none" stroke="#00f0ff" stroke-opacity="0.7">
      <circle r="70" stroke-dasharray="6 10"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="24s" repeatCount="indefinite"/></circle>
      <circle r="48" stroke="#7c5cff" stroke-dasharray="30 12"><animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="14s" repeatCount="indefinite"/></circle>
      <circle r="22" fill="#00f0ff" fill-opacity="0.12"><animate attributeName="r" values="20;26;20" dur="3s" repeatCount="indefinite"/></circle>
      <circle r="4" fill="#00f0ff"/>
    </g>
    <text x="60" y="78" font-family="Consolas, Menlo, monospace" font-size="14" fill="#00f0ff" letter-spacing="3">// SYSTEM ONLINE &#183; NEURAL LINK ESTABLISHED</text>
    <text x="60" y="140" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="58" font-weight="700" fill="url(#glow)" letter-spacing="2">SARANSH GUPTA</text>
    <text x="60" y="185" font-family="Consolas, Menlo, monospace" font-size="20" fill="#cfe9ff">
      <tspan>&gt; </tspan><tspan>AI Engineer</tspan>
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.3;0.31;0.34;1" dur="9s" repeatCount="indefinite"/>
    </text>
    <text x="60" y="185" font-family="Consolas, Menlo, monospace" font-size="20" fill="#cfe9ff" opacity="0">&gt; LLM &amp; RAG Systems Builder
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.33;0.34;0.64;0.65;1" dur="9s" repeatCount="indefinite"/></text>
    <text x="60" y="185" font-family="Consolas, Menlo, monospace" font-size="20" fill="#cfe9ff" opacity="0">&gt; Multi-Agent Architect
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.66;0.67;1" dur="9s" repeatCount="indefinite"/></text>
    <rect x="60" y="205" width="8" height="3" fill="#00f0ff"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></rect>
  </g>
  <rect x="1" y="1" width="998" height="258" rx="14" fill="none" stroke="url(#glow)" stroke-opacity="0.6"/>
</svg>
